<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HYROX Pro · 18-Month Campaign</title>
<style>:root{
  --bg:#0d0d0f; --surface:#141418; --surface2:#1c1c22; --border:#222228; --border2:#2a2a32;
  --text:#f0f0ee; --text2:#9090a0; --muted:#6b6b75;
  --accent1:#5a7aff; --accent2:#7c3aed;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh}
input,button{font-family:inherit}

/* Header */
.header{background:var(--surface);padding:20px 16px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}
.brand{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--accent1);text-transform:uppercase;margin-bottom:3px}
.date-big{font-size:26px;font-weight:700;line-height:1.2}
.week-phase{font-size:13px;color:var(--text2);margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.phase-badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.04em}
.deload-badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.04em;background:rgba(96,165,250,.16);color:#60a5fa}

/* Nav + AM/PM tabs */
.nav-row{display:flex;gap:8px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.nav-btn{flex:1;padding:9px 6px;border:1px solid var(--border2);border-radius:8px;background:var(--surface2);color:var(--text2);font-size:13px;cursor:pointer;font-weight:600}
.nav-btn.active{background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;border-color:transparent}
.tabs{display:flex;gap:8px;padding:12px 16px 0}
.tab{flex:1;padding:10px;border:1px solid var(--border2);border-radius:10px;background:var(--surface2);color:var(--text2);font-weight:700;font-size:14px;cursor:pointer}
.tab.active{background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;border-color:transparent}

/* Sections */
.section{margin:18px 14px 0}
.section-label{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--accent1);text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.section-line{flex:1;height:1px;background:var(--border)}
.session-name{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:8px}
.ex-list{display:flex;flex-direction:column;gap:6px}

/* Exercise card */
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.ex-card.done .ex-header{opacity:.4}
.ex-card.done .ex-name{text-decoration:line-through;color:var(--muted)}
.ex-header{display:flex;align-items:center;gap:11px;padding:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ex-header:active{background:var(--surface2)}
.check-box{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--surface2);color:#fff}
.ex-card.done>.ex-header .check-box{background:linear-gradient(135deg,var(--accent1),var(--accent2));border-color:transparent}
.chk{display:none;width:13px;height:11px}
.ex-card.done>.ex-header .check-box .chk{display:block}
.ex-name-wrap{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.ex-name{font-size:14px;color:#e8e8e6;line-height:1.4;font-weight:500}
.info-btn{width:18px;height:18px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);color:var(--muted);cursor:pointer;flex-shrink:0;font-size:11px;font-style:italic;font-family:Georgia,serif;line-height:1;padding:0}

/* Type tags */
.type-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;flex-shrink:0;white-space:nowrap;letter-spacing:.04em}
.tag-cardio{background:rgba(59,130,246,.18);color:#60a5fa}
.tag-sprint{background:rgba(251,146,60,.18);color:#fb923c}
.tag-cooldown{background:rgba(148,163,184,.12);color:#94a3b8}
.tag-lift{background:rgba(52,211,153,.15);color:#34d399}
.tag-plyo{background:rgba(167,139,250,.18);color:#a78bfa}
.tag-core{background:rgba(45,212,191,.15);color:#2dd4bf}
.tag-dist{background:rgba(251,191,36,.15);color:#fbbf24}
.tag-hyrox{background:rgba(248,113,113,.15);color:#f87171}

/* Metric panels */
.metrics{border-top:1px solid var(--border);padding:12px 13px 13px;background:var(--bg)}
.m-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.m-row:last-child{margin-bottom:0}
.m-label{font-size:11px;color:var(--muted);font-weight:600;width:64px;flex-shrink:0}
.m-input{flex:1;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;font-size:14px;background:var(--surface2);color:var(--text);-webkit-appearance:none}
.m-input:focus{outline:none;border-color:var(--accent1)}
.m-unit{font-size:12px;color:var(--muted);width:48px;flex-shrink:0}

/* Sets grid */
.sets{display:flex;flex-direction:column;gap:6px}
.set-head{display:flex;gap:6px;padding:0 0 2px;align-items:center}
.col-num,.col-chk{width:40px;flex-shrink:0}
.col-label{width:48px;flex-shrink:0;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.col-fill{flex:1;font-size:10px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.04em}
.set-row{display:flex;align-items:center;gap:6px}
.set-num,.set-label{font-size:12px;color:var(--muted);font-weight:600;width:40px;flex-shrink:0}
.side-label{font-size:10px;font-weight:700;color:var(--accent1);letter-spacing:.06em;width:40px;flex-shrink:0;text-transform:uppercase}
.set-input{flex:1;padding:8px 6px;border:1px solid var(--border2);border-radius:8px;font-size:14px;background:var(--surface2);color:var(--text);-webkit-appearance:none;text-align:center;min-width:0}
.set-input:focus{outline:none;border-color:var(--accent1)}
.rep-hint{font-size:11px;color:var(--muted);text-align:left}
.set-check{width:40px;height:34px;flex-shrink:0;border:1px solid var(--border2);border-radius:8px;background:var(--surface2);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.set-row.done .set-check{background:linear-gradient(135deg,var(--accent1),var(--accent2));border-color:transparent}
.set-row.done .set-check .chk{display:block}
.set-row.done .set-input{opacity:.4;text-decoration:line-through}
.set-row.done .set-num,.set-row.done .set-label,.set-row.done .side-label{opacity:.4}

/* Preview-only chrome */
.preview-note{margin:16px 14px 0;padding:12px 14px;border:1px dashed var(--border2);border-radius:10px;color:var(--text2);font-size:13px;line-height:1.5}
.gallery-label{margin:24px 14px 4px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ── Controller chrome (Stage 3) ── */
.edited-badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:rgba(251,191,36,.16);color:#fbbf24}
.skip-chip{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(248,113,113,.12);color:#f87171}
.date-tap{display:inline-flex;align-items:center;gap:5px;color:var(--accent1);font-size:12px;margin-top:4px;cursor:pointer;font-weight:600;position:relative}
.date-tap input[type=date]{background:transparent;border:none;color:var(--accent1);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:0;outline:none}
.date-tap input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.7);opacity:0.9;cursor:pointer}
.body{padding:0 0 60px}

.set-controls{display:flex;gap:8px;margin-top:8px}
.mini-btn{flex:1;padding:7px;border:1px dashed var(--border2);border-radius:7px;background:transparent;color:var(--accent1);font-size:12px;font-weight:600;cursor:pointer}
.mini-btn.rm{color:var(--muted)}

.rest-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 13px;border-top:1px solid var(--border);background:var(--surface)}
.rest-label{font-size:12px;color:var(--text2)}
.rest-start{padding:5px 14px;border:1px solid var(--accent1);border-radius:99px;background:transparent;color:var(--accent1);font-size:12px;font-weight:700;cursor:pointer}


.actions{display:flex;flex-direction:column;gap:8px;margin:18px 14px 0}
.act-btn{padding:10px;border:1px solid var(--border2);border-radius:8px;background:transparent;color:var(--text2);font-size:13px;cursor:pointer}
.act-btn.skip{border-color:rgba(248,113,113,.3);color:#f87171}

.skip-banner{margin:18px 14px;padding:14px;border:1px solid rgba(248,113,113,.25);border-radius:12px;background:rgba(248,113,113,.08);display:flex;align-items:center;justify-content:space-between;gap:10px}
.skip-banner-text{color:#f87171;font-weight:600;font-size:14px}
.unskip-btn{padding:7px 16px;border:1px solid var(--border2);border-radius:8px;background:transparent;color:var(--text2);cursor:pointer}
.no-workout{padding:60px 20px;text-align:center;color:var(--muted)} .no-workout .sub{font-size:13px;margin-top:6px}

/* Timer overlay */
.timer-ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:center;justify-content:center}
.timer-ov.flash{background:rgba(52,211,153,.25);transition:background .2s}
.timer-card{display:flex;flex-direction:column;align-items:center;gap:28px}
.timer-ring{width:200px;height:200px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(#34d399 360deg,#222228 0)}
.timer-ring .timer-num{width:170px;height:170px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700;color:var(--text)}
.timer-btns{display:flex;gap:12px}
.timer-btns button{padding:12px 28px;border:1px solid var(--border2);border-radius:10px;background:var(--surface2);color:var(--text2);font-size:15px;font-weight:600;cursor:pointer}
.timer-btns button.primary{background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;border-color:transparent}

/* Bottom sheets (info + edit) */
.sheet-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 20px 40px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;border-top:1px solid var(--border)}
.sheet-pill{width:40px;height:4px;background:var(--border2);border-radius:99px;margin:0 auto 16px}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:10px}
.sheet-body{font-size:15px;color:var(--text2);line-height:1.7}
.sheet-close{display:block;margin:20px auto 0;padding:10px 28px;border:1px solid var(--border2);border-radius:8px;background:transparent;color:var(--text2);font-size:14px;cursor:pointer}
.ed-lab{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:14px 0 4px}
.ed-sess{width:100%;padding:9px;border:1px solid var(--border2);border-radius:8px;background:var(--surface2);color:var(--text);font-size:14px;margin-bottom:8px}
.ed-row{display:flex;gap:6px;margin-bottom:6px}
.ed-name{flex:1;padding:8px;border:1px solid var(--border2);border-radius:8px;background:var(--surface2);color:var(--text);font-size:13px;min-width:0}
.ed-type{padding:8px;border:1px solid var(--border2);border-radius:8px;background:var(--surface2);color:var(--text);font-size:12px}
.ed-del{width:34px;border:1px solid var(--border2);border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}
.ed-actions{display:flex;gap:8px;margin-top:18px}
.ed-actions button{flex:1;padding:11px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text2)}
.ed-actions .ed-save{background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;border-color:transparent}
.ed-actions .ed-restore{color:#fbbf24;border-color:rgba(251,191,36,.3)}

/* Intensity block inside info sheet */
.intensity{margin-top:14px;padding:12px 14px;border:1px solid rgba(251,146,60,.3);border-radius:10px;background:rgba(251,146,60,.07)}
.intensity-title{font-size:13px;font-weight:700;color:#fb923c;margin-bottom:6px}
.intensity-body{font-size:14px;color:var(--text2);line-height:1.6}
.pace{margin-top:12px;padding:12px 14px;border:1px solid rgba(90,122,255,.32);border-radius:10px;background:rgba(90,122,255,.08)}
.pace-title{font-size:13px;font-weight:700;color:#8aa0ff;margin-bottom:6px}
.pace-body{font-size:14px;color:var(--text2);line-height:1.6}
.pace-edit{display:inline-flex;gap:6px;align-items:center;margin-top:8px}
.pace-in{width:72px;padding:6px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:var(--text);font-size:14px}
.pace-edit button{padding:6px 12px;border-radius:8px;border:none;background:#5a7aff;color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.ergnote{margin-top:12px;padding:11px 14px;border:1px solid rgba(125,211,160,.3);border-radius:10px;background:rgba(125,211,160,.07);font-size:13.5px;color:var(--text2);line-height:1.55}
.guardrail{margin-top:12px;padding:11px 14px;border:1px solid rgba(234,179,8,.3);border-radius:10px;background:rgba(234,179,8,.07);font-size:13.5px;color:var(--text2);line-height:1.55}

/* Order recommendation banner + relabeled tabs */
.lastlog{margin-bottom:8px;padding:6px 10px;border:1px solid var(--border2);border-radius:8px;background:rgba(255,255,255,.03);font-size:11px;color:var(--text2)} .lastlog b{color:var(--text)}
.udl-banner{margin:10px 14px;padding:9px 12px;border-radius:10px;border:1px solid rgba(45,212,191,.45);background:rgba(45,212,191,.08);font-size:12px;color:var(--text);display:flex;justify-content:space-between;align-items:center;gap:10px}
.udl-banner b{color:#2dd4bf}
.udl-banner button{padding:4px 12px;border:1px solid #2dd4bf;border-radius:99px;background:transparent;color:#2dd4bf;font-size:11px;font-weight:700;cursor:pointer}
.block-card{margin:10px 14px;padding:12px 13px;border-radius:10px;border:1px solid var(--accent1);background:rgba(96,165,250,.08)}
.block-kind{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent1);margin-bottom:2px}
.block-title{font-size:14px;font-weight:700;line-height:1.4}
.block-members{margin:4px 8px 10px 20px;padding-left:10px;border-left:2px solid var(--border2)}
.bt-row{display:flex;align-items:center;gap:8px;margin-top:9px}
.bt-time{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;min-width:64px}
.bt-btn{padding:5px 12px;border:1px solid var(--accent1);border-radius:99px;background:transparent;color:var(--accent1);font-size:11px;font-weight:700;cursor:pointer}
.block-inputs{display:flex;gap:8px;align-items:center;margin-top:8px}
.block-inputs label{font-size:11px;color:var(--text2)}
.note-card{margin:10px 14px;padding:11px 13px;border-radius:10px;border:1px solid var(--border2);border-left:3px solid var(--accent1);background:rgba(96,165,250,.06);font-size:13px;line-height:1.5;color:var(--text)}
.tabs .tab{display:flex;align-items:center;gap:9px;text-align:left}
.tab-num{font-size:16px;font-weight:700;opacity:.7;flex-shrink:0}
.tab-txt{display:flex;flex-direction:column;min-width:0}
.tab-main{font-size:13px;font-weight:700;line-height:1.2}
.tab-sub{font-size:10px;font-weight:500;opacity:.7;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Let tab flex items shrink so long Saturday labels ellipsize instead of overflowing the viewport */
.tabs .tab{min-width:0;overflow:hidden}
body{overflow-x:hidden}

<script>// Data layer: exercise explanation library
const EXPLANATIONS={"Zone 2 erg":"Steady aerobic work on the row, ski, or bike at a fully conversational Zone 2 pace — you can speak in complete sentences. This is base-building volume: low stress, low impact (kind to your back and joints), and repeatable day after day. If you cannot talk comfortably you are going too hard — ease off. Autoregulate the duration toward the top of the range when sleep and legs feel good.","Threshold Run":"Your Monday quality run — sustained work right at lactate threshold, the single biggest lever for HYROX run splits. Hold the prescribed effort exactly and evenly; the skill is repeatability, not a fast first rep.","Cruise intervals":"Threshold work broken into longer continuous blocks (e.g. 3x10 min) with short jogs between. Run each block right at the hardest pace you could hold steadily for 30–60 minutes — breathing hard, only 2–3 words at a time. Keep every block identical; if you fade, you started too fast. This pushes your lactate threshold, which directly lowers your race run pace.","VO2 intervals":"Near-maximal aerobic intervals (about 3–4 min at ~95–100%, equal easy recovery) that raise your VO2 max — the ceiling your threshold sits under. Run or erg each hard segment close to all-out but evenly paced, then genuinely ease off in the recovery so you can repeat it. Don't turn the easy half into a jog-race. Do these fresh; quality over quantity.","Zone 2 run":"Run at a fully conversational pace — you should be able to speak in full sentences. Heart rate 65–75% of max. This builds your aerobic base without accumulating fatigue. If you can't speak comfortably, slow down.","Hill acceleration":"Sprint uphill at near-maximum effort for about 10 seconds, then walk all the way back down before the next rep. Drive the knees high, pump the arms, and stay tall. The incline reduces impact and shortens the stride, which makes it harder to overstride and easier on the hamstrings while still building sprint power and drive. Build into each rep rather than jerking from a dead stop. Common fault: continuing once posture breaks down — end the set when your form gets sloppy.","Cooldown walk":"Walk at an easy pace to bring heart rate down gradually. Keep moving — stopping abruptly after hard effort slows recovery.","Warm-up jog":"Very easy jog, 50–60% effort. The goal is to raise body temperature, lubricate joints, and prepare the cardiovascular system. Not a workout — purely preparatory.","Main set":"Your primary interval work for the session — the quality piece. Run each rep at the prescribed effort (see the intensity note below) and treat the listed recovery as a minimum, taking slightly more only if your pace or form is degrading. Even pacing across all reps matters more than a fast first rep.","Recovery jog":"Light jog between intervals, typically 90 seconds. Keep moving rather than stopping — active recovery clears lactate faster than standing still.","Cooldown jog":"Easy jog at the end of the session to gradually lower heart rate. Helps reduce post-exercise soreness and begins the recovery process.","Tempo block":"Sustained running at a comfortably hard pace — roughly a 7/10 effort. You can speak a word or two but not full sentences. This trains your lactate threshold, which is critical for HYROX run performance.","Strides":"Relaxed 20-second bursts of fast running — not sprinting. Think smooth and controlled at about 85% effort: run tall with quick, light turnover and loose shoulders and face, accelerating smoothly into the stride rather than lunging out of it. Walk or stand fully between reps. They prime the legs for faster running and sharpen neuromuscular efficiency without creating fatigue. Common fault: straining into a near-sprint — they should feel fast but easy.","Row erg":"Rowing machine. Sequence every stroke legs → back → arms: with arms straight and torso tall, drive explosively through the legs first (they make ~60% of the power), then swing the torso back to roughly 11 o'clock, and only then pull the handle into your lower ribs. Reverse the order on the recovery — arms away, hinge forward from the hips, then bend the knees — and slide out slowly to load the next drive. Keep the handle tracking in a straight horizontal line and never round your lower back. Common faults: opening the back too early, bending the arms before the legs finish, and rushing the recovery so you lose rhythm.","Ski erg":"Vertical flywheel machine that mimics the double-pole motion in cross-country skiing. Set up tall: feet hip-width, knees soft, core braced, grip the handles just above head height with nearly straight arms. Drive each stroke by crunching your torso down and forward — hinge at the hips and contract your abs — sweeping the handles down past your hips while your lats do the work; the arms mostly transmit force rather than pull. Finish with hands near your thighs and hips back, then ride the handles smoothly back to full overhead extension before the next stroke. Keep a neutral spine throughout. Common faults: squatting up and down instead of hinging, bending the arms early, and short choppy strokes — long, rhythmic, full-range strokes move far more air per pull.","Assault bike":"Air-resistance fan bike driven by both arms and legs at once — resistance rises the harder you push, so it punishes uneven pacing. Sit tall, drive through the legs while pushing and pulling the handles, and lock into a sustainable cadence rather than spiking then fading. Because the fan gives nothing back when you coast, the smartest pacing is a steady rhythm you can hold for the whole interval. These intervals are prescribed by TIME rather than metres, because the fan bike has no reliable distance unit. Keep the prescribed time fixed as you get fitter — you do not shorten it; you simply cover more work within it. Log calories as your progress metric: on the same bike, more calories in the same time means a bigger engine. The interval length still grows across the training phases, but that reflects the program progressing, not your benchmark — so you never need to re-set these times.","Easy flush":"Very light erg work at Zone 1–2 intensity. The goal is blood flow and lactate clearance after the hard intervals, not additional training stimulus. Keep it easy.","Zone 2 flush":"Easy aerobic work at the end of a session to promote recovery. Zone 2 pace — fully conversational. Helps clear metabolic byproducts from the harder work.","Run before each station":"In a HYROX race you run 1km before each of the 8 stations. In training, run the prescribed distance at race pace before transitioning immediately into the next station. Practice keeping your heart rate high as you move between exercises.","Sled push":"Load the sled and push it the prescribed distance using short, powerful steps. Stay low, drive from your hips, and keep your back flat. Hands on the upright poles, arms locked out. This is one of the hardest HYROX stations — practice your breathing strategy.","Sled pull":"Trained as a stationary hand-over-hand pull: set up tall and athletic with a braced core and soft knees, then reel the rope in hand-over-hand, driving each pull from your lats and upper back and finishing by squeezing the shoulder blades. Keep your trunk rigid and let your back and arms do the work — this is deliberately a back-and-grip exercise, not leg drive, which also keeps it easy on your spine. Pull at a controlled, repeatable rhythm and don't over-grip early — grip is shared with the row and farmer's carry later. Common faults: yanking with the arms instead of the back, rounding or overextending the lower back, and frying your forearms by going too hard too soon.","Burpee broad jumps":"From standing, drop to a push-up position, perform a push-up, jump feet forward, then broad jump forward as far as possible. Repeat continuously for the prescribed distance. Pace yourself — going too fast early destroys your form and slows you down overall.","Farmer carry":"Pick up a heavy implement in each hand (dumbbells, kettlebells, or handles) and walk the prescribed distance tall: chest up, shoulders down and back, core braced, arms hanging straight. Take controlled steps; don't let the weights swing or your torso lean side to side. Grip is usually the limiter — squeeze hard and reset at the turn if you need to. In the PM strength context the load is intentionally heavier than HYROX race weight to build carry capacity above race demands; in the simulation it is at race weight for the prescribed distance.","Sandbag lunge":"Hold a sandbag on one shoulder or bear-hug it in front. Lunge forward alternating legs for the prescribed distance. Keep your torso upright, front knee tracking over your toes. The sandbag shifts your center of gravity — brace your core hard.","Wall balls":"Hold a medicine ball at chest height. Squat to parallel, then explosively stand and throw the ball to the designated target (Men's Pro target 3.00 m / ~9.84 ft). Catch it on the way down and absorb into the next squat. Keep a consistent rhythm.","Barbell Bulgarian split squat":"Rear foot elevated on a bench, barbell on your upper back (or front rack). Lower your back knee toward the floor, keeping your torso upright and front knee tracking your toes. Develops unilateral leg strength critical for HYROX running power without spinal compression.","Goblet cyclist squat":"Hold a dumbbell or kettlebell at your chest (goblet) with your heels elevated on a plate or wedge. The raised heels let the knees travel forward and shift the load heavily onto the quads. Keep your chest up and torso fairly upright, squat as deep as you can control, then stand driving through the whole foot. A potent quad builder that spares the lower back because the load is light and held in front. Common faults: heels too low (loses the quad bias) and the chest dropping forward.","Belt squat":"Heavy bilateral squatting with the load hung from a hip belt — your spine carries nothing, which is exactly why it anchors Lower I. Stand on the platform, belt snug on the hips, drive through mid-foot to a depth you control. Knee-friendlier than a hack sled: your feet are free, so find the stance and shin angle that feel clean. Same top-set protocol as any primary: climb every set, stop one rep shy of grinding.","Hack squat":"Load the hack squat machine and position your shoulders under the pads with feet slightly forward. Lower until your thighs are parallel, then drive back up through your heels. Builds significant quad and glute strength with the back fully supported. A great addition to belt squat days when you want more total lower body volume.","Reverse sled drag":"Attach a harness or hold handles, face the sled, and walk backward pulling it behind you. Keeps tension on the quads throughout and is very low-impact — often used in rehab and for athletes with back issues. Great quad and knee builder.","Suitcase carry":"Hold a weight in one hand only and walk. Resist the urge to lean — the whole challenge is staying upright and square. Works the obliques, quadratus lumborum, and hip stabilizers unilaterally. Essential for HYROX carry events.","Single-leg press":"Leg press machine using one leg at a time. Foot in the middle of the platform. Keep your lower back pressed into the pad. Addresses strength imbalances between legs and builds quad/glute strength without spinal loading.","Front rack carry":"Hold a pair of dumbbells or kettlebells in the front-rack position — elbows high and forward, weights resting on the shoulders and forearms — and walk the prescribed distance tall. Because the load sits in front, it pulls you into flexion, so brace your abs hard and keep the ribcage stacked over the pelvis. Take short controlled steps and breathe behind the brace. More core- and upper-back-demanding than a farmer carry, and it builds the thoracic extension strength that protects your spine under load. Common faults: elbows dropping and the lower back overarching.","Lateral sled drag":"Face sideways relative to the sled with a hip harness or cable attachment. Walk sideways, dragging the sled. Develops hip abductor strength and lateral stability — often neglected but important for running economy.","Step-up weighted":"Hold dumbbells and step onto a box, driving through the heel of the elevated foot. Don't push off the back foot. Each rep should be controlled and unilateral. Builds glute and quad strength with minimal spinal load.","Walking lunge":"Hold weights and take long, controlled lunges forward. Keep your torso upright and your front knee over your ankle. Cover the prescribed distance at a controlled pace. Builds single-leg strength and hip flexor length.","Spanish squat":"Loop a band around a pole, hold the band at chest height, and sit back into a squat with your shins vertical and knees out. The band pulls you forward while you resist, loading the quads intensely without spinal compression. Excellent for knee and quad health.","Front-foot elevated split squat":"Set your front foot on a 1–2 inch plate or wedge and your rear foot back on the floor (toe down). Keep your torso tall and your core braced, then lower straight down until the rear knee nearly touches, front knee tracking over the foot. Drive up through the front heel. The front-foot elevation lengthens the range at the hip and biases the glute and hip-flexor stretch versus a flat split squat — strong unilateral leg work with zero spinal compression. Common faults: leaning forward onto the front toe and using a short, shallow range.","Cossack squat":"Take a wide stance with toes slightly out. Shift your weight onto one leg and sit into a deep squat on that side while the other leg stays straight with toe up and heel down. Keep the working heel flat and your chest up; let the straight leg's foot pivot. Push back to the start and shift to the other side. Go only as deep as you can control with a neutral spine, adding depth over weeks. Builds hip mobility, adductor length, and single-leg strength at once. Common faults: the working heel lifting and the chest collapsing forward.","Bench press":"Lie on a flat bench with your eyes under the bar, feet planted, and a slight natural arch in your lower back. Pull your shoulder blades down and together and keep them pinned to the bench — this protects the shoulders and creates a stable base. Grip slightly wider than shoulder-width, unrack, and lower the bar under control to your mid-chest with elbows tucked to roughly 45–75°, not flared wide. Press up and slightly back toward your face to lockout, driving your feet into the floor for whole-body tension. Builds the pressing strength behind sled push and carry posture. Common faults: bouncing the bar off the chest, flaring the elbows, and letting the shoulders round forward off the bench.","Pull-up":"Hang from a bar with an overhand grip slightly wider than shoulder-width. Pull your chest to the bar, keeping your core tight. Lower with control. If you can't do full pull-ups yet, use a band or assisted machine. This is your primary back strength movement.","Weighted pull-up":"Same as a pull-up but with added load via a dip belt, a weight held between the feet, or a vest. Only progress here once you can do 8+ clean bodyweight reps. Keep strict mechanics — full hang at the bottom, chest toward the bar at the top, core braced to stop the legs swinging — and prioritize full range of motion over piling on weight. Builds the maximal pulling strength behind HYROX pulling stations and overall back power. Common faults: shortening the range as the load climbs, and kipping to grind out reps.","DB shoulder press":"Seated with back support or standing, hold a dumbbell at each shoulder, palms forward. Brace your core and squeeze your glutes to lock the ribcage down — do NOT arch the lower back to help drive the weight, which is the main way overhead work aggravates the spine. Press up and slightly together until the arms extend, then lower under control to ear height with wrists stacked over elbows. Builds overhead pressing strength and shoulder stability for carries and wall balls. Common faults: lower-back arching, pressing the weights out in front, and cutting the range short.","Chest-supported row":"Lie face-down on an incline bench with your chest supported, holding dumbbells or a barbell with arms hanging straight. Row toward your lower chest by driving your elbows back and squeezing your shoulder blades together at the top, then lower under full control and let the shoulder blades reach forward at the bottom. The chest support removes the lower back from the lift entirely — ideal for your disc history. Builds upper-back thickness and the retraction strength that keeps you from collapsing forward under fatigue. Common faults: shrugging the traps instead of retracting, and using momentum rather than a controlled pull.","Landmine press":"Wedge one end of a barbell into a landmine sleeve or a corner and load the other end. Hold the loaded end at shoulder height with one hand, stand staggered or square, core braced and glutes tight. Press up and slightly forward along the bar's natural arc until the arm extends, then lower under control back to the shoulder. Because the bar travels on an arc rather than straight overhead, it's one of the most shoulder- and lower-back-friendly pressing patterns — overhead-style loading without the spinal extension a strict barbell press demands. Work one arm at a time and log the load and reps per side. Common faults: leaning back to heave the weight up, and letting the working shoulder shrug toward the ear.","Single-arm cable row":"Set a cable at mid height and row with one arm at a time from a staggered stance or seated. Begin with the shoulder blade reaching forward, then pull by driving the elbow back and retracting the shoulder blade, finishing with the handle at your lower ribs. Resist the cable's pull to rotate you — keep your hips and shoulders square. The single-arm setup gives a longer range and exposes left/right imbalances. Common faults: twisting the torso to yank the weight and shrugging the trap instead of rowing with the back.","Incline DB press":"Set a bench to 30–45°. Hold a dumbbell at each shoulder, shoulder blades pulled down and back, and press up and slightly together until the arms extend; lower under control to just below shoulder level for a full stretch. The incline shifts emphasis to the upper chest and front delts and is often friendlier on the shoulders than flat pressing. Keep the lower back in a natural, braced position rather than arching to push. Common faults: too steep an incline (turns it into a shoulder press), bouncing at the bottom, and flaring the elbows straight out.","Seal row":"Lie face-down on an elevated bench and row a barbell off the floor. Complete elimination of lower back involvement. One of the best pure upper back movements. Pull the bar to your lower chest and hold briefly at the top.","Push press":"From a standing position with the bar at shoulder height, dip slightly at the knees then drive up explosively with your legs, pressing the bar overhead. The leg drive allows you to move heavier weight than a strict press. Builds explosive upper body power.","Single-arm farmer carry":"Carry a single heavy weight in one hand and walk the prescribed distance staying perfectly upright and square — the offset load tries to bend you sideways and your job is to resist it. Brace the obliques and keep both shoulders level; don't lean away from the weight. Switch hands each set to balance both sides. This is anti-lateral-flexion training that builds the lateral core and grip needed for HYROX carries. Common faults: leaning, hiking one hip, and letting the weight swing.","Battle ropes":"Anchor a heavy rope at its midpoint and hold one end in each hand. Sit into an athletic quarter-squat — hips back, knees soft, core braced — and drive continuous waves down the rope, alternating arms or both together, for the prescribed time. The power comes from a rhythmic whole-body action, not just the arms. Keep the intensity high; this is a conditioning and grip-endurance finisher, not a strength lift, so there's no external weight to log. Common faults: standing too upright and letting the waves die out as you fatigue.","Pogo hops":"Small, fast, two-footed hops staying on the balls of your feet. Minimal knee bend — think of your ankles as springs. Builds reactive strength in the calf and Achilles tendon. The foundation of all jumping and sprinting ability.","Broad jump":"Stand with feet hip-width. Load by swinging both arms back as you hinge at the hips and dip the knees, then explosively swing the arms forward and extend through ankles, knees, and hips to jump as far forward as you can. Land softly on both feet with bent knees and hips back, absorbing the landing like a spring rather than a thud. Reset fully between reps — this is max power, not conditioning. Builds the horizontal explosive power behind sled drive and acceleration. Common faults: a short choppy arm swing, stiff-kneed landings, and rushing reps.","Box jump":"Jump onto a box with two feet, landing softly with bent knees. Step down — don't jump down. Focus on a powerful arm swing and triple extension (ankle, knee, hip) at takeoff. The height should be challenging but allow a safe, controlled landing.","Low box jump":"A box jump onto a lower box, used on deload weeks for crisp technique without maximum effort. Focus on a clean arm swing, full triple extension at takeoff, and a soft, quiet landing with the hips back. Step down between reps rather than jumping down. Keeps the movement pattern sharp while letting the legs recover.","Depth drop to jump":"Stand on a low box, step (don't jump) off, and land on both feet with quick, soft absorption — then immediately rebound into a maximal vertical jump. The brief landing pre-stretches the tendons so they release like a spring. The whole point is minimal ground-contact time: land and leave the floor fast, don't sink into a slow squat. Use a box height (~12–24 in) that lets you land and rebound under control. A true plyometric — do these fresh, early in the session, never fatigued. Common fault: pausing on the ground, which kills the elastic effect.","Depth drop to sprint":"Same setup as a depth drop, but redirect the energy horizontally into an explosive 5–10 m sprint instead of jumping up. Step off the box, land soft and quick, and immediately accelerate out with an aggressive forward lean and hard first steps. This trains the reactive horizontal power you need to drive out of a HYROX station into your next run. Keep ground-contact time short. Do these fresh — quality over quantity. Common fault: floating off the box and landing flat, which removes the reactive demand.","Lateral bounds":"From a single-leg stance, push off explosively and bound sideways as far as you can, landing on the opposite foot only. Stick the landing with a soft, bent knee and a stable hip before bounding back the other way. Keep your chest up and absorb each landing rather than letting the knee cave inward. Builds lateral power and the single-leg stability that improves running economy and change of direction. Common faults: the knee collapsing in on landing and short, tentative bounds.","Reactive lateral bound":"A lateral bound done for maximum reactivity — land on the outside foot and rebound the other way as fast as possible, treating the landing foot as a spring rather than a brake. Minimize ground-contact time; the goal is elastic, not grinding. Keep the knee tracking over the foot and the hip stable on each landing. Builds reactive lateral power and ankle/hip stiffness for running and direction changes. Common fault: pausing or sinking deep on landing, which removes the reactive stimulus.","Split stance jump":"Start in a lunge with one foot forward and both knees bent. Jump explosively straight up, switch leg positions in the air, and land softly in a lunge with the opposite foot forward, immediately absorbing into the next rep. Keep the torso upright and the front knee tracking the foot on each landing. Builds unilateral explosive power, coordination, and landing control. Common faults: short hops with no air time and crashing into the bottom of each landing.","Plyo push-up":"From a strong push-up position with a rigid, braced core, lower under control then press up explosively hard enough that your hands leave the floor. Land with soft elbows and immediately absorb into the next rep. Master regular hands-leave-the-floor push-ups before progressing to claps or elevated/deficit variations. Builds upper-body pressing power and rate of force development. Common faults: piking or sagging the hips, and landing with stiff, locked-out elbows.","Med ball chest throw":"Stand facing a wall with a medicine ball at your chest. Explosively throw it against the wall by extending your arms. Catch the rebound and repeat. Builds explosive pushing power — translates directly to sled pushes.","Med ball rotational throw":"Stand sideways to a wall, rotate away from it, then explosively rotate toward it and throw the ball against the wall. Builds rotational power through the core and hips. Critical for running mechanics and overall athleticism.","Rotational med ball slam":"Stand side-on to a wall or open space holding a medicine ball. Rotate and reach the ball up and back over one shoulder, then explosively rotate the hips and torso and slam it down toward the opposite hip, letting the whole body uncoil. Catch or pick it up and repeat, alternating sides each rep. The power comes from the hips and trunk rotating together, not the arms. Builds the rotational core power that drives running mechanics and athleticism. Common fault: arming the ball down without rotating through the hips.","Max effort box jump":"A box jump at absolute maximum effort onto the highest box you can land on safely. Load with a big arm swing and aggressive triple extension at ankles, knees, and hips, then land softly in a quarter-squat and stick it — hips back, knees tracking the toes. Step down between reps and take full recovery; these are about peak power, so quality beats quantity. Only do them fully warmed up. Common faults: tucking the knees to clear a box that's too tall (a mobility trick, not more power) and crashing the landing.","Max effort vertical jump":"Jump as high as possible from a two-foot takeoff. Reach up and touch a wall or object to measure height. Track your progress — this is your vertical jump test.","Loaded jump squat":"Hold light dumbbells at your sides or a light barbell on your back and perform explosive jump squats: dip to a quarter or half squat and jump as high as possible, landing softly and absorbing before the next rep. Keep the load light enough that jump height stays high — this is a power exercise, not a strength one, so speed and height beat heavy weight. Brace the core to keep the spine neutral on landing. Common faults: too much weight (height collapses) and stiff, heavy landings.","Repeated broad jumps":"Perform broad jumps back-to-back, landing and immediately exploding into the next with no reset pause. The brief, springy ground contact stores and returns elastic energy, training your legs to recycle force quickly. Land soft but rebound fast, keep the chest up, and end the set when distance per jump drops noticeably. Builds the elastic horizontal power that carries to running and acceleration. Common faults: long pauses between reps and heavy, flat landings.","Single-leg reactive bound":"Bound forward or laterally on one leg, landing and immediately rebounding off the same foot with minimal ground contact. Treat the foot and ankle as a stiff spring and keep the knee tracking over the toes with a stable hip. Builds single-leg reactive strength and ankle stiffness for running. Do these fresh and stop the set when contact times start to lengthen. Common fault: landing soft and slow, which turns a plyometric into a balance drill.","Hurdle hop series":"Set a line of low hurdles or cones about a stride apart. Hop over them continuously on both feet, landing softly and rebounding immediately off the balls of the feet — quick, rhythmic, and reactive rather than high and slow. Stay tall, let the arms assist the rhythm, and keep minimal knee bend so the ankles do the springing. Builds reactive stiffness, coordination, and landing control. Common faults: long ground-contact pauses between hurdles and crumpling on landing.","Bird dog":"A McGill staple for building endurance in the spinal extensors without loading the spine — ideal with a disc history. From all fours, reach one arm and the opposite leg long, pause, return slowly. The goal is a perfectly still, neutral spine while the limbs move: no rotation, no lumbar sag, no rushing.","Side plank":"Lie on your side, prop yourself on your forearm and the side of your foot. Keep your body in a straight line from head to heel. Hold for the prescribed time. Builds lateral core stability and the quadratus lumborum — critical for protecting herniated discs.","Pallof press":"Stand sideways to a cable machine or band anchor. Hold the handle at your chest, then press it straight out in front of you and hold briefly before returning. The resistance tries to rotate you — you resist. Builds anti-rotation core strength without spinal flexion.","Copenhagen plank":"Set up like a side plank but rest your TOP foot or shin on a bench, supported only by your forearm and that top leg, with the bottom leg free. Hold a straight head-to-heel line; lift the bottom leg up to meet the top for the full version or leave it hanging for an easier one. Squeeze the inner thigh of the top leg hard to hold position. Start higher up the shin (or knee on the bench) and progress toward the ankle on the bench as you get stronger. One of the best adductor and hip-stability exercises for running injury prevention. Common fault: hips sagging — keep them stacked and lifted.","Hollow hold":"Lie on your back, press your lower back flat into the floor, and lift your legs and shoulders just off the ground with arms reaching overhead, forming a shallow banana shape. Brace everything from shoulders to hips and keep the lower back glued down — if it lifts, raise your legs higher until it stays. Progress from bent knees to straight legs over time. Builds the whole-front-core tension that underpins every other lift. Common fault: the lower back arching off the floor.","Ab wheel rollout":"Kneel with the wheel under your shoulders. Brace your abs and tuck the pelvis slightly, then roll the wheel forward as far as you can while keeping your hips from sagging and your lower back from arching — never let the spine hyperextend. Pull back by contracting the abs, not by yanking with the hip flexors. Start with a short, controlled range (or roll toward a wall as a depth stop) and extend over time. One of the most effective anti-extension core builders. Common fault: hips dropping and the lower back diving as you reach — shorten the range before that happens.","Weighted Copenhagen plank":"A Copenhagen plank (top foot on a bench, supported on forearm and top leg) with added load — a plate balanced on the top hip or a weighted vest. Hold a straight head-to-heel line and squeeze the top inner thigh hard to keep the hips lifted and stacked. Only progress here once you can hold a clean bodyweight Copenhagen for ~45 seconds per side. Adds adductor and lateral-core strength for running durability. Common fault: letting the hips sag once weight is added — reduce the load before sacrificing position.","Foam roll":"Roll slowly over each major muscle group — quads, IT band, glutes, upper back, calves. Spend extra time on tight spots. This is soft tissue work, not a stretch. Promotes recovery and reduces soreness.","Hip flexor stretch":"Kneel in a lunge position, tuck your pelvis slightly, and shift forward until you feel a stretch in the front of the rear hip. Tight hip flexors are common with high training volume and can contribute to lower back pain. Hold each side for the full prescribed time.","Thoracic mobility":"Sit on the floor or use a foam roller under your mid-back. Rotate side to side or extend over the roller, focusing on the upper and mid-back. Thoracic stiffness compensates at the lower back — keeping it mobile protects your discs.","Hamstring stretch":"Lying on your back, hold one leg with both hands and straighten it toward the ceiling. Keep the other leg flat on the floor. Hamstring tightness contributes to lower back pain — this stretch is important given your disc history.","Ankle mobility drill":"Stand facing a wall with your toes a few inches away. Drive your knee forward toward the wall without letting your heel come up. Work each side. Ankle mobility directly affects squat depth and running mechanics.","Dead bug":"Lie flat on your back with arms pointing straight up toward the ceiling and knees bent at 90 degrees directly above your hips. Press your lower back firmly into the floor — this contact must be maintained throughout. Slowly lower one arm overhead and extend the opposite leg toward the floor simultaneously, keeping both just above the floor at the bottom. Return and repeat on the other side. The challenge is resisting any rotation or lower-back lift. Move slowly and breathe out as you extend.","Dead bug with resistance band":"Same movement as a standard dead bug but with a resistance band looped around your feet or hands to increase the anti-extension demand. The band pulls you out of position — your job is to stay completely still through the core while moving the limbs. Start light and prioritize control over resistance level.","Hollow body hold":"Lie on your back and press your lower back into the floor. Extend your legs straight and raise them to about 30–45 degrees, while simultaneously raising your shoulders off the floor and reaching your arms overhead. Your body forms a gentle banana curve. Every muscle from hip to shoulder should be braced. If your lower back lifts off the floor, raise your legs higher until it stays down. Build duration progressively.","Hollow body rock":"Get into the hollow body hold position, then gently rock forward and backward like a rocking chair. The shape of your body must not change — maintain the curve throughout. This adds a dynamic element that challenges your ability to maintain tension under movement. If you lose the hollow position, pause and reset.","Cable woodchop":"Stand sideways to a cable machine with the cable set high. Grip the handle with both hands and pull it diagonally downward across your body in a chopping motion, rotating through your torso. Keep your hips mostly facing forward — the rotation comes from the thoracic spine, not the lower back. Control the return. This builds rotational strength and is excellent for HYROX running power.","Rotational cable chop":"Similar to the cable woodchop but with a more neutral cable height and greater emphasis on hip and thoracic rotation. Stand perpendicular to the cable, feet shoulder-width apart. Initiate the movement with your hips, rotate your torso, and follow through with your arms. The lower back should stay stable — all rotation above the hips. Excellent for building the rotational power that drives running mechanics.","L-sit hold":"Support your body weight on parallel bars or dip handles with your arms straight. Lift your legs parallel to the floor and hold. Your body forms an L shape. Keep your shoulders depressed and your core maximally braced. This is an extremely demanding isometric — even 5–10 seconds is significant progress early on. Compress your hip flexors and quads hard to keep the legs up.","Hanging knee raise":"Hang from a pull-up bar with an overhand grip. From a dead hang, bring your knees up toward your chest by flexing your hips, then lower them with control. Avoid swinging — initiate each rep from a still position. Builds lower ab strength and hip flexor endurance, which are both critical for HYROX running and station transitions.","Hanging leg raise":"Same as hanging knee raise but with straight legs, which dramatically increases the difficulty. Keep your legs together and raise them until they are at least parallel to the floor — higher if you can. Lower with complete control. If you swing, pause at the bottom before the next rep. One of the most effective lower core exercises available.","Hanging leg raise with twist":"Perform a hanging leg raise but at the top of the movement, rotate your hips to one side before lowering. Alternate sides each rep. The twist adds an oblique and rotational demand on top of the standard lower core work. Keep the movement controlled — don't use momentum to swing into the rotation.","Dragon flag negative":"Lie on a bench and grip the bench behind your head for support. Press your shoulders into the bench and lift your entire body — from shoulders to feet — off the bench in a straight line supported only by your upper back. From this top position, slowly lower your body toward the bench with maximum control, taking 4–6 seconds to descend. Stop before your lower back touches and hold briefly. This eccentric loading builds the strength needed for full dragon flags. One of the most demanding core exercises — protect your lower back by never letting it hyperextend.","Dragon flag":"The full version of the dragon flag negative. From the lowered position, drive back up to the top under your own power. Your entire body should move as one rigid unit — no pike, no sag at the hips. This requires elite core and hip flexor strength. Only progress to this when your negatives feel fully controlled. Bruce Lee's signature movement — it earns its reputation.","Toes-to-bar":"Hang from a pull-up bar and raise your straight legs until your toes touch the bar — STRICT only, no kip, ever. Initiate from a hollow body position and lead with hip flexion; pause dead at the bottom between reps so momentum never creeps in. If straight legs break down, bend the knees rather than swinging. Builds the entire anterior chain under load while the hang keeps the spine decompressed.","Landmine lateral raise":"Anchor a barbell in a landmine attachment or wedge it into a corner. Stand perpendicular to the bar with the loaded end at your side. Grip the sleeve with one hand, arm straight. Resist the weight pulling you into a side bend — hold for the prescribed time or perform slow lateral lifts. This is a pure anti-lateral-flexion exercise. The weight tries to collapse you sideways; you maintain a perfectly upright posture. Far safer than any loaded side bend for disc health.","Lat pulldown":"Sit at a lat pulldown machine, grip the bar slightly wider than shoulder-width with an overhand grip. Pull the bar down to your upper chest, leading with your elbows and squeezing your lats at the bottom. Lean back very slightly — about 10 degrees. Control the return fully. This is your primary lat exercise when pull-ups are too challenging, and a useful accessory even when you can do pull-ups.","Step-up":"Stand in front of a sturdy box or bench. Step one foot fully onto the box, then drive through that heel to stand up on top. The key is doing all the work with the elevated leg — don't push off the back foot. Lower with control. This is a highly functional single-leg strength exercise that also has direct crossover to HYROX running power and stair climbing ability.","Depth drop to max jump":"Step off a box and absorb the landing with a quick, stiff dip — then immediately explode upward for maximum height. The drop pre-loads your tendons like a spring. The key word is immediately — ground contact should be as brief as possible. This is a true shock method plyometric. Only do these when fully warmed up and with a box height that allows a controlled landing.","Easy walk":"Walk at a relaxed, comfortable pace. Heart rate should be well below Zone 2 — this is active recovery, not training. Focus on breathing, posture, and letting the body flush out yesterday's fatigue. On recovery days this is all you need. Resist the urge to push the pace.","Barbell hip thrust":"Sit on the floor with your upper back against a bench, barbell across your hips (use a pad). Plant your feet flat, hip-width apart. Drive through your heels and thrust your hips upward until your body is in a straight line from knees to shoulders. Squeeze your glutes hard at the top and hold briefly. Lower with control. This is the single best exercise for glute strength and directly improves running power, sled drive, and carry stability. Completely spine-safe — no spinal compression involved.","Dips":"Use parallel bars or a dip station. Support yourself with straight arms, then lower your body by bending your elbows until your upper arms are roughly parallel to the floor. Press back up to full extension. Lean slightly forward to emphasize chest; stay upright for triceps emphasis. For HYROX, this builds the pushing strength and tricep endurance that carries over to sled push mechanics. Add weight with a belt as you get stronger.","Dumbbell bench press":"Lie on a flat bench holding a dumbbell in each hand at chest level. Press them up and slightly together at the top, then lower with control. The dumbbells allow a greater range of motion than a barbell and require more stabilizer activation. Alternate between this and barbell bench press across the week for complete chest development.","Pec deck":"Sit at the machine with your arms on the pads. Bring the pads together in front of your chest using a hugging motion, squeezing your pecs at peak contraction. Slowly return to the start. This is a pure chest isolation movement — excellent for building chest thickness and the mind-muscle connection that carries over to more explosive pressing movements.","Cable front raise":"Stand facing away from a low cable pulley. Hold the handle with one or both hands and raise your arm(s) forward to shoulder height. Control the return. Builds anterior deltoid strength which is important for overhead pressing patterns and shoulder health under fatigue — especially relevant when your shoulders are under sustained load during HYROX carries.","Cable lateral raise":"Stand sideways to a low cable pulley, hold the handle in the far hand, and raise it out to the side to shoulder height. Control the descent. Cable tension keeps consistent load through the full range unlike dumbbells. Builds the medial deltoid for shoulder width and overhead stability. Run this back-to-back with front raises.","Straight arm pulldown":"Stand at a cable machine with a straight bar set high. Keep your arms straight and pull the bar down to your thighs using your lats only — no elbow bending. This isolates the lats without involving the biceps and is excellent for building the lat connection needed for rowing, skiing, and pull-ups. Focus on feeling the lats contract, not just moving the weight.","Seated cable row":"Sit at a cable row station with a neutral or wide grip. Keep your chest up and pull the handle into your lower abdomen, driving your elbows back and squeezing your shoulder blades together at the end. Slowly extend back to the start. One of the most complete horizontal pulling movements — builds the mid and upper back needed to resist forward collapse during HYROX runs and station transitions.","Face pulls":"Set a cable at face height with a rope attachment. Pull the rope toward your face, separating your hands as they reach your ears. Your elbows should finish higher than your hands. This exercise targets the rear deltoids and external rotators of the shoulder — muscles that are chronically underdeveloped and critical for preventing the shoulder rounding that happens under fatigue. Non-negotiable for long-term shoulder health.","Single-arm supported DB row":"Place one hand and the same-side knee on a bench for support. Let the working arm hang with the dumbbell. Row the weight up by driving your elbow toward the ceiling, keeping your back flat. Full range of motion — let the shoulder blade protract at the bottom and retract fully at the top. The support eliminates lower back involvement entirely, making this an ideal heavy row variation for your disc situation.","Dumbbell shrugs":"Hold a heavy dumbbell in each hand at your sides. Shrug your shoulders straight up toward your ears as high as possible, hold briefly at the top, then lower slowly. No rolling motion. Builds upper trap strength which is important for carrying heavy loads with good posture — directly transfers to farmer carries and sandbag lunges in HYROX.","Incline dumbbell press":"Set an incline bench to 30–45 degrees. Hold dumbbells at shoulder height and press upward, touching them lightly at the top. Lower slowly past shoulder level. Targets the upper chest and front delts more than flat pressing. Important for balanced chest development and pairs well with barbell flat bench on the same push day.","Lying leg curl":"Lie face down on the leg curl machine. Hook your ankles under the pad and curl your legs up toward your glutes. Hold briefly at peak contraction, then lower slowly. One of the few exercises that directly trains the hamstrings in the lengthened position — crucial for hamstring health, sprint speed, and protecting your knees under load. The machine format means zero spinal involvement.","Leg press":"Sit in the leg press machine with feet shoulder-width on the platform. Lower the sled until your knees are at 90 degrees, then press back to just short of lockout. Adjust foot position to target different areas: higher = more glutes and hamstrings, lower = more quads. Completely spine-supported alternative to back squats — you can load this very heavily without any spinal compression.","Single-leg RDL":"Single-leg Romanian deadlift. Hinge at the hip on one leg, lowering a dumbbell toward the floor while the free leg extends behind you for balance. Keep a neutral spine — this is back-safe hamstring/glute work, your main hamstring builder in the first 6 months. Record the weight of the ONE dumbbell. Move slowly and controlled; balance is part of the exercise.","Cable side raises":"Standing lateral raise on a cable, one arm at a time or with a strap. Raise the handle out to the side to shoulder height, leading with the elbow, then lower under control. Targets the side delts for shoulder width and pressing health. Record the weight on the stack.","Nordic hamstring curl":"Kneel with ankles anchored; lower your torso toward the floor as slowly as possible using the hamstrings to resist, catch with the hands, then push back. Eccentric-focused — extremely effective for hamstring strength and injury resilience. Introduced only after week 27 once a base is built. Start with assisted/partial range. Bodyweight; track reps.","Run":"Run the prescribed distance at the stated effort. In simulations this is \"compromised running\" — running while fatigued from the stations, exactly like race day. Hold the labelled effort (race pace, or easy/moderate on deload weeks) and treat each run as its own segment. Log distance and time.","Kettlebell swing":"Explosive hip-hinge power for the sled and broad jumps. Drive the bell with a sharp hip snap, NOT a squat or an arm lift. Keep a neutral spine throughout — the power comes from the hips, the back just stays braced and flat. Stop the set the moment form degrades; this is a power exercise, not a grinder.","Goblet squat":"Front-loaded squat held at the chest. Because the load sits in front, the torso stays upright and the spine stays neutral — a back-friendly way to train the squat-to-throw pattern you need for wall balls. Sit between the hips, knees tracking over toes, full depth if your hips allow.","Kettlebell clean and press":"A full-body power-endurance builder that rehearses driving load from the floor to overhead. Clean to the rack with a hip snap, then press or push-press overhead. Keep the ribs down on the press, no lower-back arch.","Kettlebell snatch":"One smooth pull from between the legs to locked-out overhead. High power output and grip/conditioning under fatigue. Punch the hand through at the top so the bell rolls over softly. Neutral spine on every rep — if your back rounds to finish the pull, the weight is too heavy.","Dumbbell thruster":"A squat straight into an overhead press — the closest gym match to the wall-ball station. Front-rack the dumbbells, squat to depth, then use leg drive to press overhead in one fluid movement. Ribs down at the top.","Dumbbell push press":"Overhead press with a small dip-and-drive from the legs, dumbbells in hand. The unilateral-friendly, lower-axial-load cousin of the barbell push press. Brace the core, ribs down, no overarch as you finish overhead.","Landmine push press":"One end of a barbell anchored in a landmine; you press the other end up and slightly forward with a leg drive. The angled path dramatically reduces direct axial spinal load versus a strict barbell overhead — a smart pressing option given your back history. Brace hard, drive with the legs.","Weekly readiness check":"Your overtraining tripwire. Each Sunday score four things against YOUR normal: (1) resting heart rate on waking (elevated 5+ bpm for 2+ days is a flag), (2) sleep quality, (3) motivation to train, (4) lingering soreness or heavy legs. If two or more are off, next week's hard sessions become easy aerobic work and you keep the volume down until the markers normalize. This isn't optional admin — it's the mechanism that makes 18 months of training sustainable. Fatigue you catch early costs a few days; fatigue you ignore costs months. Also watch the classics: disrupted sleep, irritability, sore throat or frequent minor illness, and performance that drops despite effort rising.","Sharpening intervals":"Short, fast, relaxed efforts used in the taper — fast enough to keep the legs snappy, short enough to create zero fatigue. Run tall and smooth at a strong but unstrained speed, then recover completely. These keep you sharp while the taper does its job. Do not turn them into a workout.","Sled push (technique)":"Light-load technique work: stay low with arms locked, take long powerful strides, and find the body angle where the sled moves smoothest. Grooving efficient mechanics at light weight now is what makes the heavy Pro sled manageable later.","Note":"Read me — context or guidance for this session rather than an exercise.","Standing calf raise":"Straight-knee raises target the gastrocnemius and load the Achilles tendon — cheap insurance for 18 months of rising run mileage. Full pause in the bottom stretch, rise all the way up, no bouncing. Add dumbbells or a machine stack once 12 smooth reps are easy.","Seated calf raise":"Bent-knee raises shift the work to the soleus — the slow-twitch endurance muscle that absorbs several times bodyweight every running stride. Slow up, slow down, full range. Higher reps on purpose: this muscle responds to volume, and it protects the Achilles and shins as mileage climbs.","Chin-up":"Underhand grip shifts emphasis to the biceps and grip alongside the lats — direct carryover to the arm-over-arm sled pull and to holding the farmers handles late in a race. Full hang at the bottom, pull to collarbone height, no kipping. Add weight when the prescribed reps are smooth.","Dumbbell walking lunge":"The gym twin of the sandbag-lunge station, with the load held low at your sides instead of on your shoulders — which keeps the spine vertical and the axial load minimal. Long, controlled steps; front knee tracks over the toes; torso tall and braced. Building strength in exactly this pattern is what keeps the 100m of race lunges from becoming the station where your legs go.","Loaded step-up":"Unilateral leg strength with the load safely in your hands (dumbbells) rather than on your spine. Use a knee-height box, drive entirely through the top foot, and resist pushing off the floor leg — that cheat removes the exercise. Carries directly to lunges, sled work, and single-leg durability for compromised running.","Stir-the-pot":"The dead bug’s graduate. Forearms on a swiss ball in a plank, then draw slow circles with your elbows while everything from shoulders to ankles stays rigid — the moving base forces the trunk to fight extension and rotation at once, at an intensity floor drills can’t reach. Hips locked, spine neutral, circles small and controlled; make them bigger only when nothing else moves. No swiss ball available: renegade rows (plank on two dumbbells, rowing one while the trunk refuses to twist) hit the same anti-rotation demand.","Single-arm dumbbell row":"Unilateral pull with the free hand braced on a bench — spine supported, zero axial load. One side at a time forces the trunk to resist rotation while the lat and grip work, which is sled-pull currency. Pull to the hip, no torso twist, control the lowering.","Alternating dumbbell snatch":"One dumbbell, floor-to-overhead in one motion — but start each rep from the hang (above the knee), not the floor, to keep the spine neutral and the hips doing the work. Punch tall at the top, switch hands each rep. Light enough to stay crisp for the whole set.","Dumbbell hang clean and press":"From the hang: hips snap the bells to the shoulders, then press overhead. No grinding — this is a rhythm movement. Ribs down at lockout, neutral spine throughout.","Box step-overs":"Step up, over, and down the other side holding dumbbells at your sides. Drive through the top leg, stay tall, no push-off from the trailing foot. The loaded, back-safe cousin of box jumps — pure leg engine under fatigue.","Hand-release push-ups":"Chest to floor, lift both hands briefly, then press. The release enforces full range and an honest rep count when you are tired — which in a metcon is always.","Strict pull-ups":"Dead hang to chin over the bar, no kip, no swing. Strict keeps the shoulders and spine safe under fatigue and builds the pulling strength that kipping only borrows.","Renegade row":"Plank on two dumbbells, row one while the trunk refuses to twist. It is a row and an anti-rotation core drill at once. Feet wide, hips dead still — if they sway, lighten the bells.","Burpees over the dumbbell":"A standard burpee, then a two-foot hop laterally over your dumbbell. The hop keeps you honest on full hip extension and adds a coordination tax under fatigue.","Burpees":"Chest to floor, snap up, small jump with full hip extension. Cycle smoothly rather than fast-then-dead — the flat back on the way down matters more the more tired you get.","Air squats":"High-rep bodyweight squats — the purest leg-lactate currency in conditioning. Chest tall, full depth, smooth continuous cycle. When these show up at 25+ reps deep in a workout, the burn IS the training effect.","Dumbbell front squat":"Dumbbells racked at the shoulders, elbows up, torso braced tall — front-loading keeps the spine vertical and back-safe while the quads and trunk work overtime.","Alternating reverse lunge":"Step back, drop, drive through the front heel. Reverse lunges are the knee-friendliest lunge pattern and stay perfectly stable under fatigue — dumbbells at the sides keep the spine unloaded.","Jumping lunges":"Explosive lunge-to-lunge switches in the air. Soft landings, tall chest, and stop the set the moment landings get loud — noisy feet are tired feet.","Jump squats":"Bodyweight only: sink, explode, land soft, absorb into the next rep. Power under fatigue distilled. Quality over height every single rep.","Lateral skater bounds":"Side-to-side single-leg bounds, sticking each landing briefly. Frontal-plane power and ankle-knee-hip resilience that straight-line running never builds.","Box jump overs":"Jump onto a LOW box, step or hop down the far side, turn, repeat. Land soft both directions — the low box is deliberate; this is about cycling, not height.","Burpee box jump overs":"A burpee, then over the low box. Possibly the most lactate per second of any back-safe movement in existence. Pace the first minute like you plan to survive the last one.","Devil's press":"A burpee that picks up two light dumbbells and swings them overhead in one motion. Flat back, hips drive the bells — never the lower back. Light means light: the engine is the target, not the lift.","Bear crawl":"Hands and feet, knees an inch off the floor, hips low and spine level — crawl smooth and quiet. Full-body engine work with zero spinal load.","Shuttle sprints":"Short sprint, touch the line, turn hard, sprint back. The turns are the point — race day is full of them and straight-line running never rehearses deceleration.","Air bike":"The most honest lactate machine in the gym — output is exactly what your legs and lungs produce, nowhere to hide. Big smooth strokes, drive through the legs, arms along for the ride. If the bike is taken, the row substitution keeps the session moving."};
// Data layer: intensity definitions (RPE + breathing/talk-test)
const INTENSITY={"conversational":{"title":"Conversational (Zone 2) · RPE 3–4/10","body":"Easy and fully conversational — you can speak in complete sentences and could breathe through your nose. You could sustain this for hours. Purpose: build the aerobic base without adding fatigue. If you can't talk in full sentences, you're going too hard — slow down."},"easy_moderate":{"title":"Easy / moderate · RPE 4–5/10","body":"Comfortable and controlled — a touch quicker than conversational, but you could still talk in short sentences and keep it up a long time. Used on deload simulations and recovery to move blood and rehearse pacing without digging a hole."},"tempo":{"title":"Tempo (comfortably hard) · RPE 6–7/10","body":"Breathing deep and rhythmic; you can get out a short phrase but not a full sentence. This sits just under your lactate threshold and trains the sustainable race engine. It should feel hard but never frantic — controlled enough to hold for the entire block."},"controlled_threshold":{"title":"Controlled threshold · RPE 7–8/10","body":"'Threshold' is the hardest pace you could hold steadily for 30–60 minutes; 'controlled' means you pick a pace you can repeat identically every rep, so your last rep matches your first instead of fading. Breathing hard — only 2–3 words at a time. If you're gasping or slowing rep to rep, you started too fast. The whole skill here is even pacing."},"race_pace":{"title":"Race pace · RPE ~8/10","body":"Your goal HYROX running pace — hard but repeatable across all eight runs. Breathing heavy and rhythmic but not out of control; a word or two only. Let the Saturday simulations calibrate the real number: it's the fastest pace you could hold for the entire race without blowing up on the later runs."},"above_race_pace":{"title":"Above race pace · RPE 8.5–9/10","body":"Deliberately faster than goal race pace to build a speed buffer and raise your ceiling. Breathing near-maximal; talking drops to single words. Hard, but the final rep should still be completable with reasonably intact form — if form falls apart, ease off slightly."},"vo2_hard":{"title":"Hard VO2 intervals · RPE 9/10","body":"Near-maximal short efforts that push your VO2 max. Breathing is maximal and you can manage only single words. Run/erg each 'hard' segment close to all-out but evenly paced — then genuinely ease off in the easy segment so you can repeat the next one. Don't turn the easy half into a jog-race."},"strides":{"title":"Strides · RPE ~8/10 but SHORT and relaxed","body":"This is smooth, fast turnover — not a max sprint. Run tall and loose with quick, light feet and no straining in the face or shoulders. Take full recovery (walk or stand) between each. Purpose: running economy and leg speed, not conditioning."},"hill_accel":{"title":"Hill acceleration · near-maximal, brief","body":"Drive near-maximally for the short ~10-second effort — big knee drive, aggressive arm action, tall posture. Walk all the way back down so every rep starts fresh. Builds power and stride force with much lower impact than flat sprinting."},"flush_recovery":{"title":"Recovery flush · RPE 2–3/10","body":"Very easy — you're just circulating blood to clear fatigue. Nose-breathing, totally relaxed, no time pressure. If it feels like a workout, you're going too hard."},"engine_steady":{"title":"Steady aerobic engine · RPE 6–7/10","body":"Strong, steady, repeatable effort — comfortably hard, breathing deep and rhythmic, a word or two at a time. Hold even splits across every interval rather than sprinting the early ones; the goal is a big sustainable engine, so the last interval should look like the first."}};
if (typeof module!=="undefined") module.exports={EXPLANATIONS,INTENSITY};
