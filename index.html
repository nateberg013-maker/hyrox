// ─────────────────────────────────────────────────────────────────────────
// CORE CLASSIFICATION LAYER  (pure, no DOM, fully unit-testable)
//
// Resolves an exercise {name, type} into a tracking spec the renderer consumes.
//
// DESIGN PRINCIPLE (fixes the old bugs):
//   `weighted`  — does this exercise get a WEIGHT input column?
//   `bilateral` — does it get alternating L / R rows?
// These are INDEPENDENT. A loaded unilateral lift (landmine press, single-leg
// RDL, Pallof press) is BOTH weighted AND bilateral. The old code conflated
// "each side" with "no weight", which stripped the weight column from every
// loaded unilateral movement. Never again.
// ─────────────────────────────────────────────────────────────────────────

// Names that are strength-distance carries/drags. Per spec these are tracked
// as LIFTS (reps × weight + weight-suggestion engine) even when the source
// data tags them `hyrox` inside a race simulation.  NOTE: "suitcase carry" is
// deliberately excluded — "Heavy suitcase carry" stays a loaded CORE movement.
const STRENGTH_DIST = [
  'sled push', 'sled pull', 'sled drag', 'reverse sled drag',
  'farmer carry', 'sandbag lunge'
];

// CORE movements that are LOADED -> get a weight column.
const LOADED_CORE = [
  'pallof', 'weighted copenhagen', 'cable woodchop', 'rotational cable chop',
  'rotational med ball slam', 'landmine lateral raise', 'heavy suitcase carry'
];

// Tag presentation per resolved type. Colours mirror the spec's theme tokens.
const TAGS = {
  cardio:   { cls: 'tag-cardio',   label: 'Cardio'    },
  sprint:   { cls: 'tag-sprint',   label: 'Sprint'    },
  cooldown: { cls: 'tag-cooldown', label: 'Cool Down' },
  warmup:   { cls: 'tag-cooldown', label: 'Warm Up'   },
  lift:     { cls: 'tag-lift',     label: 'Weights'   },
  plyo:     { cls: 'tag-plyo',     label: 'Plyos'     },
  core:     { cls: 'tag-core',     label: 'Core'      },
  dist:     { cls: 'tag-dist',     label: 'Distance'  },
  hyrox:    { cls: 'tag-hyrox',    label: 'Functional'}
};

const lc = (s) => (s || '').toLowerCase();
const hasAny = (s, arr) => arr.some(k => lc(s).includes(k));

// ── Bilateral: alternating L/R rows. "each hand" (simultaneous carries) excluded.
function isBilateral(name) {
  const n = lc(name);
  if (n.includes('each hand')) return false;
  return /each side|each leg|each arm|per side|per leg|per arm/.test(n);
}

// ── Resolve the effective (display) type from raw {name, type}.
function resolveType(name, type) {
  if (hasAny(name, STRENGTH_DIST)) return 'lift';   // carries/sleds -> lift
  return type;
}

// ── Does this exercise get a weight input column?
function isWeighted(name, rt) {
  switch (rt) {
    case 'lift': return true;                       // includes sleds/carries
    case 'core': return hasAny(name, LOADED_CORE);  // only LOADED core
    case 'plyo': return false;                      // never
    case 'hyrox': return /wall ball/i.test(name || '');  // wall balls log weight; burpees/ropes stay unweighted
    default: return false;                          // cardio/sprint/cooldown/dist
  }
}

// ── Reps measured in time/seconds (holds) rather than count?
function isTimeBased(name) {
  return /\b\d+\s*sec\b|\bsec each|\bmin\b/i.test(name) && /\d+\s*x\s*\d+\s*sec/i.test(name)
      || /\d+\s*x\s*\d+\s*sec/i.test(name);
}

// ── Distance-loaded? "NxMm" (metres) in a sets-grid movement means the second
//    number is a DISTANCE, not a rep count (sleds, carries, sandbag lunges,
//    burpee broad jumps). The renderer must label it "Distance (m)", not "Reps".
function isDistanceLoad(name) {
  const n = (name || '').replace(/to\s+\d+(?:\.\d+)?\s*m\s*\(\d+ft\)\s*target/i, '');  // a wall-ball TARGET HEIGHT is not a travel distance
  return /\d+\s*x\s*\d+\s*m\b/i.test(n)   // interval form: "3x22m"
      || /\b\d+\s*m\b/i.test(n);          // single/station form: "25m @ 102kg", "180–200m"
}

// ── Parse "NxM" set/rep notation. Returns {sets, reps} or null.
//    Handles "3x10", "4x4 each leg", "8x28m", "2x60 sec each side", "5x1 min".
function parseSets(name) {
  const m = lc(name).match(/(\d+)\s*x\s*(\d+)/);
  if (!m) return null;
  return { sets: parseInt(m[1], 10), reps: parseInt(m[2], 10) };
}

// ── Sprint sub-kind: distance grid (per-rep times) vs short-effort checkmarks.
//    Distance sprint = has a "NxDDDm" metre distance (e.g. 3x800m, 5x1200m).
function isDistanceSprint(name) {
  return /\d+\s*x\s*\d{3,}\s*m\b/i.test(name);
}

// ── Metric mode the renderer will use.
function metricMode(rt, name) {
  if (rt === 'cardio') return /assault bike/i.test(name) ? 'bike' : 'cardio';  // bike: cals+time, not km
  if (rt === 'sprint') return isDistanceSprint(name) ? 'sprintTime' : 'sprintReps';
  if (rt === 'cooldown' || rt === 'warmup') return 'check';   // checkbox only
  if (rt === 'dist') return 'cardio';                   // vestigial; treat like cardio
  // lift / plyo / core / hyrox -> sets grid
  return 'sets';
}

// ── Main entry point.
function classify(name, type) {
  const rt = resolveType(name, type);
  const tag = TAGS[rt] || TAGS.hyrox;
  const weighted = isWeighted(name, rt);
  const bilateral = isBilateral(name);
  const mode = metricMode(rt, name);
  const timeBased = mode === 'sets' && isTimeBased(name);
  const distanceBased = mode === 'sets' && !timeBased && isDistanceLoad(name);
  const parsed = parseSets(name);
  return {
    resolvedType: rt,
    tagClass: tag.cls,
    tagLabel: tag.label,
    mode,                 // 'cardio' | 'bike' | 'sprintTime' | 'sprintReps' | 'check' | 'sets'
    weighted,             // show a weight column?
    bilateral,            // show L / R rows?
    timeBased,            // reps measured in seconds?
    distanceBased,        // reps column is actually metres?
    defaultSets: parsed ? parsed.sets : 1,   // no NxM = single-effort station
    defaultReps: parsed ? parsed.reps : null
  };
}

if (typeof module !== 'undefined') {
  module.exports = {
    classify, resolveType, isWeighted, isBilateral, isTimeBased,
    parseSets, isDistanceSprint, isDistanceLoad, metricMode, TAGS, STRENGTH_DIST, LOADED_CORE
  };
}

function bikePanel(key) {

function specFor(ex, extra) {

function exerciseCard(ex, key, extra, inBlk) {

function section(label, sublabel, cardsHtml) {

function renderItems(items, prefix, extras){

function blockHeaderCard(ex,key){

    : '<div class="bt-row"><span class="bt-time" data-bt="'+key+'">'+fmtClock(b.seconds||0)+'</span><button class="bt-btn" onclick="btStart(\''+key+'\',\'down\','+(b.seconds||0)+')">Start</button><button class="bt-btn" onclick="btPause(\''+key+'\')">Pause</button><button class="bt-btn" onclick="btReset(\''+key+'\','+(b.seconds||0)+')">Reset</button></div>';
  return '<div class="block-card" data-key="'+key+'"><div class="block-kind">'+kindLbl+'</div><div class="block-title">'+esc(ex.text)+'</div>'+timerRow+inputs+'</div>';

function renderSession(day, which, extras) {
  extras = extras || {};

  const name = day[which + '_name'];
  const prefix = which === 'am' ? 'a' : 'p';
  const isSim = which === 'am' && (/hyrox simulation/i.test(name || '') || items.some(function(e){return ['cardio','sprint','cooldown'].indexOf(e.type)===-1;}));
  const card = (ex, key) => exerciseCard(ex, key, extras[key] || 0);

  if (isSim) return section(name || 'Session', '', renderItems(items, prefix, extras||{}));
  if (which === 'pm') return section(name, '', renderItems(items, prefix, extras||{}));

  const firstMain = items.findIndex(e => e.type === 'cardio' || e.type === 'sprint');
  const cut = firstMain === -1 ? items.length : firstMain;
  const warm = items.filter((e, i) => e.type === 'cooldown' && i < cut);
  const cardio = items.filter(e => e.type === 'cardio');
  const sprint = items.filter(e => e.type === 'sprint');
  const cool = items.filter((e, i) => e.type === 'cooldown' && i >= cut);
  let html = '', idx = 0;
  const grp = (lbl, sub, arr) => arr.length
    ? section(lbl, sub, arr.map(ex => card(ex, prefix + (idx++))).join('')) : '';
  html += grp('Warm Up', '', warm);
  html += grp('Cardio', name, cardio);
  html += grp('Sprints', '', sprint);
  html += grp('Cool Down', '', cool);
  return html;
}

// Key -> exercise map, in the SAME order/keys renderSession assigns. Used by
// the controller so handlers can resolve a card key back to its exercise.
function sessionEntries(day, which) {
  const items = day[which];
  const name = day[which + '_name'];
  const prefix = which === 'am' ? 'a' : 'p';
  const isSim = which === 'am' && (/hyrox simulation/i.test(name || '') || items.some(function(e){return ['cardio','sprint','cooldown'].indexOf(e.type)===-1;}));
  if (isSim || which === 'pm') return items.map((ex, i) => ({ key: prefix + i, ex }));
  const firstMain = items.findIndex(e => e.type === 'cardio' || e.type === 'sprint');
  const cut = firstMain === -1 ? items.length : firstMain;
  const order = [
    ...items.filter((e, i) => e.type === 'cooldown' && i < cut),
    ...items.filter(e => e.type === 'cardio'),
    ...items.filter(e => e.type === 'sprint'),
    ...items.filter((e, i) => e.type === 'cooldown' && i >= cut)
  ];
  return order.map((ex, i) => ({ key: prefix + i, ex }));
}

if (typeof module !== 'undefined') {
  module.exports = { exerciseCard, metricPanel, setsPanel, renderSession, section, specFor, sessionEntries };
}


// ─────────────────────────────────────────────────────────────────────────
// FEATURE LOGIC LAYER (pure, Node-testable). No DOM, no localStorage here —
// app.js wraps these with persistence + event wiring.
// ─────────────────────────────────────────────────────────────────────────
const _C = (typeof require !== 'undefined') ? require('./classify.js') : null;
const _classify   = _C ? _C.classify   : classify;          // eslint-disable-line
const _STRENGTH   = _C ? _C.STRENGTH_DIST : STRENGTH_DIST;   // eslint-disable-line

const PLAN_START = '2026-08-10';

// ── Local date (NEVER toISOString — that shifts by timezone) ───────────────
function localDateStr(d) {
  d = d || new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}
function dateFromStr(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = dateFromStr(s); d.setDate(d.getDate() + n); return localDateStr(d); }
function daysBetween(a, b) { return Math.round((dateFromStr(b) - dateFromStr(a)) / 86400000); }

// ── mm:ss formatting. "1900"->"19:00". Seconds are clamped to 59 ONLY on
//    finalize (blur) — never mid-typing, or "190" would prematurely become
//    "1:59" and corrupt the entry as you keep typing.
function formatTimeInput(raw, finalize) {
  const digits = String(raw).replace(/\D/g, '');
  if (digits.length === 0) return '';
  if (digits.length <= 2) return digits;               // still typing minutes
  let sec = digits.slice(-2), min = digits.slice(0, -2);
  if (finalize && parseInt(sec, 10) > 59) sec = '59';
  return min + ':' + sec;
}

// ── Set sub-keys for an exercise (MUST match render.js row ids) ────────────
function setSubKeys(spec) {
  const n = spec.defaultSets || 1;
  if (spec.mode === 'sets') {
    const out = [];
    if (spec.bilateral) for (let i = 1; i <= n; i++) { out.push(i + 'L'); out.push(i + 'R'); }
    else for (let i = 1; i <= n; i++) out.push(String(i));
    return out;
  }
  if (spec.mode === 'sprintTime' || spec.mode === 'sprintReps') {
    const out = []; for (let i = 1; i <= n; i++) out.push('r' + i); return out;
  }
  return [];   // cardio / check: completion tracked at exercise level
}

// ── Checkmark sync (bidirectional) ─────────────────────────────────────────
function allSetsChecked(checkedMap, subKeys) {
  return subKeys.length > 0 && subKeys.every(k => !!checkedMap[k]);
}
function setAllChecks(subKeys, value) {
  const m = {}; subKeys.forEach(k => { m[k] = value; }); return m;
}

// ── Rest durations (seconds). 0 = no timer (rest is in the text). ──────────
function isStrengthDistName(text) {
  const n = (text || '').toLowerCase();
  return _STRENGTH.some(k => n.includes(k));
}
function restSeconds(spec, text) {
  if (spec.mode !== 'sets') return 0;                 // cardio/sprint/cooldown
  if (isStrengthDistName(text)) return 60;            // sleds/carries
  switch (spec.resolvedType) {
    case 'plyo': return 120;                          // non-negotiable
    case 'core': return 45;
    case 'hyrox': return 60;                          // burpees/wallballs/ropes
    case 'lift': return (spec.defaultReps != null && spec.defaultReps <= 5) ? 180 : 90;
    default: return 60;
  }
}
function fmtRest(secs) {
  if (secs >= 60 && secs % 60 === 0) return (secs / 60) + ' min';
  if (secs >= 60) return Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0') + ' min';
  return secs + ' sec';
}

// ── Exercise-name normalisation for suggestion matching ────────────────────
function normalizeExName(text) {
  return String(text).split('—')[0]
    .replace(/\([^)]*\)/g, '')        // drop "(dumbbell)" etc.
    .trim().toLowerCase().replace(/\s+/g, ' ');
}

// (weight suggestion engine removed by user request)
function round5(x) { return Math.round(x / 5) * 5; }

// ── Deload detection (every 4th week) ──────────────────────────────────────
function isDeloadWeek(week) { return week === 5; } // wk5 was the one scheduled deload before the sub-60 rebuild; none ahead — user-called only // scheduled deload every 5th week (Aug 2026 rebuild); user-called deloads via button remain

// ── Skip / shift: which plan date does a calendar date show? ───────────────
// Each skipped day pushes all later content back by one day.
function planDateForCalendar(calDate, skipped) {
  if (skipped.includes(calDate)) return null;          // this day is a rest day
  const skipsBefore = skipped.filter(s => s < calDate).length;
  const idx = daysBetween(PLAN_START, calDate) - skipsBefore;
  if (idx < 0) return null;
  const pd = addDays(PLAN_START, idx);
  return pd;
}
function totalSkips(skipped) { return skipped.length; }

// ── Intensity: map a card name to an effort slug (definitions live in INTENSITY data) ──
function intensityKeyFor(name) {
  const n = (name || '').toLowerCase();
  const pairs = [
    ['above race pace', 'above_race_pace'],
    ['race pace', 'race_pace'],
    ['controlled threshold', 'controlled_threshold'],
    ['easy/moderate', 'easy_moderate'],
    ['conversational', 'conversational'],
    ['tempo', 'tempo'],
    ['min hard', 'vo2_hard'],
    ['fast relaxed', 'strides'],
    ['strides', 'strides'],
    ['hill acceleration', 'hill_accel'],
    ['flush', 'flush_recovery']
  ];
  for (const [p, k] of pairs) if (n.includes(p)) return k;
  // unlabeled erg-engine intervals (row/ski metres or assault-bike time) = steady aerobic
  if (/\b(row erg|ski erg|assault bike)\b/.test(n) && /\d+\s*x\s*\d+/.test(n)) return 'engine_steady';
  return null;
}

// ── Pace anchoring ─────────────────────────────────────────────────────────
// The benchmark is the user's HYROX RUN pace (sec/km), taken from a recent
// race-effort Saturday simulation. Those splits are run BETWEEN stations, so
// they already reflect race fatigue — which makes the anchor the single most
// race-specific number available for the runs themselves (1:1), and a sound
// base to offset the other run zones from. Erg work is deliberately excluded:
// a row/ski /500m split is different units, so we never fabricate one from a
// run pace — erg cards keep their effort/RPE description only.
// Offsets are sec/km relative to the anchor A. Smaller = faster.
const PACE_OFFSETS = {
  above_race_pace:     [-15, -8],
  controlled_threshold:[-7, -1],
  race_pace:           [-3,  3],
  tempo:               [ 8, 18],
  easy_moderate:       [40, 65],
  conversational:      [55, 85]
};
function pacesFromAnchor(secPerKm) {
  const A = Number(secPerKm);
  if (!A || A <= 0) return null;
  const out = {};
  for (const k in PACE_OFFSETS) {
    const [lo, hi] = PACE_OFFSETS[k];
    out[k] = { lo: Math.round(A + lo), hi: Math.round(A + hi) };
  }
  return out;
}
// Pace NUMBERS apply only to running cards. Erg/bike cards are excluded.
function isRunPaceContext(name) {
  const n = (name || '').toLowerCase();
  if (/\b(row erg|ski erg|assault bike|erg)\b/.test(n)) return false;
  return /\brun\b|tempo block|main set|zone 2 run|\bjog\b/.test(n);
}
function fmtPace(sec) {
  const s = Math.max(0, Math.round(Number(sec) || 0));
  const m = Math.floor(s / 60), r = s % 60;
  return m + ':' + String(r).padStart(2, '0');
}
function parsePace(str) {
  const m = String(str || '').trim().match(/^(\d{1,2}):([0-5]?\d)$/);
  if (!m) return null;
  const sec = (+m[1]) * 60 + (+m[2]);
  return (sec >= 120 && sec <= 900) ? sec : null;   // 2:00–15:00 /km sanity band
}
// #5 — polarized easy-day guardrail (easy efforts only).
const EASY_SLUGS = new Set(['conversational', 'easy_moderate', 'flush_recovery']);
function guardrailFor(ik) {
  if (!EASY_SLUGS.has(ik)) return '';
  return "Keep this genuinely easy — don't let it drift into 'medium.' The hard days only do their job when the easy days stay easy and let you recover. The one deliberate exception is a scheduled cut-down finish, which says so explicitly.";
}
// #3 — erg-engine rotation rationale (shown on the rotating interval cards).

// Only SUSTAINED hard runs earn "cardio first". Hill sprints / strides are
// short neuromuscular PRIMERS, not the quality block, so they don't flip an
// easy aerobic day away from lifting first.
const HARD_CARDIO = new Set(['above_race_pace', 'vo2_hard', 'race_pace', 'controlled_threshold', 'tempo']);
const CARDIO_RANK = ['above_race_pace', 'vo2_hard', 'race_pace', 'controlled_threshold', 'tempo',
  'hill_accel', 'strides', 'engine_steady', 'easy_moderate', 'conversational', 'flush_recovery'];
function dayCardioKey(day) {
  let best = null, bestRank = 999;
  for (const e of (day.am || [])) {
    const k = intensityKeyFor(e.text); if (!k) continue;
    const r = CARDIO_RANK.indexOf(k);
    if (r >= 0 && r < bestRank) { bestRank = r; best = k; }
  }
  return best;
}

// ── last-logged lookup (factual only: what you did, when — no recommendations) ──
function lastLogged(exText){
  const target = normalizeExName(exText);
  for(let i=1;i<=180;i++){
    const cd = addDays(curDate,-i); if(cd < PLAN_MIN) break;
    let log; try{ log = JSON.parse(localStorage.getItem('hx4-'+cd)||'{}'); }catch(e){ continue; }
    for(const k in log){
      const e = log[k];
      if(e && e.name && normalizeExName(e.name)===target && e.s){
        const subs = Object.keys(e.s).sort();
        const sets = subs.map(s=>({ r:e.s[s]&&e.s[s].r, w:e.s[s]&&e.s[s].w }))
                         .filter(x=>(x.r!=null&&x.r!=='')||(x.w!=null&&x.w!==''));
        if(sets.length) return { date: cd, sets };
      }
    }
  }
  return null;
}
function fmtLastLogged(ll){
  const md=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const [y,m,d]=ll.date.split('-');
  const reps=ll.sets.map(s=>s.r).filter(r=>r!=null&&r!=='');
  const wts =ll.sets.map(s=>s.w).filter(w=>w!=null&&w!=='');
  let parts=[];
  if(reps.length){
    const uniq=[...new Set(reps)];
    parts.push(uniq.length===1 ? reps.length+'×'+uniq[0] : reps.join(', ')+' reps');
  }
  if(wts.length){
    const uw=[...new Set(wts.map(Number))].sort((a,b)=>a-b);
    parts.push('@ '+(uw.length===1?uw[0]:uw[0]+'–'+uw[uw.length-1])+' lbs');
  }
  return 'Last: <b>'+parts.join(' ')+'</b> · '+md[+m-1]+' '+(+d);
}

function openTimer(total){
  closeTimer();
  const ov=document.createElement('div'); ov.className='timer-ov'; ov.id='timer-ov';
  ov.innerHTML=`<div class="timer-card">
    <div class="timer-ring" id="t-ring"><div class="timer-num" id="t-num"></div></div>
    <div class="timer-btns"><button onclick="skipTimer()">Skip</button><button class="primary" onclick="closeTimer()">Done</button></div>
  </div>`;
  document.body.appendChild(ov);
  const endAt=Date.now()+total*1000;
  const calc=()=>Math.max(0,Math.round((endAt-Date.now())/1000));
  let remaining=calc();
  const paint=()=>{
    const frac=remaining/total;
    const deg=Math.max(0,frac)*360;
    let col = frac>0.5 ? '#34d399' : frac>0.2 ? '#fbbf24' : '#f87171';
    const ring=document.getElementById('t-ring'); if(!ring) return;
    ring.style.background=`conic-gradient(${col} ${deg}deg, #222228 ${deg}deg)`;
    const m=Math.floor(remaining/60), s=remaining%60;
    document.getElementById('t-num').textContent = m>0 ? `${m}:${String(s).padStart(2,'0')}` : String(s);
  };
  paint();
  const step=()=>{ remaining=calc(); paint();
    if(remaining<=0){ clearInterval(timer); timer=null; timerDone(); } };
  window.__timerResync=step;
  timer=setInterval(step,500);
}
function timerDone(){
  try{ if(navigator.vibrate) navigator.vibrate([120,80,120,80,200]); }catch(e){}
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    [660,880,1100].forEach((f,i)=>{ const o=ac.createOscillator(),g=ac.createGain();
      o.frequency.value=f; o.connect(g); g.connect(ac.destination);
      const t=ac.currentTime+i*0.18; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16); o.start(t); o.stop(t+0.17); });
  }catch(e){}
  const ov=document.getElementById('timer-ov'); if(ov){ ov.classList.add('flash'); setTimeout(closeTimer,700); }
}

// ── block timer: wall-clock based, survives app-switching; state persisted ──
const BT_KEY='hx4-blocktimer';
function btGet(){ try{return JSON.parse(localStorage.getItem(BT_KEY)||'null');}catch(e){return null;} }
function btSet(s){ try{ if(s) localStorage.setItem(BT_KEY, JSON.stringify(s)); else localStorage.removeItem(BT_KEY);}catch(e){} }
function fmtClock(t){ t=Math.max(0,Math.round(t)); const m=Math.floor(t/60), s=t%60; return m+':'+String(s).padStart(2,'0'); }
function btStart(key,mode,secs){
  const st=btGet();
  if(st && st.key===key && st.paused){
    if(st.mode==='down') st.endAt=Date.now()+st.left*1000; else st.startAt=Date.now()-st.left*1000;
    st.paused=false; btSet(st); btTick(); return;
  }
  btSet({key,mode,secs:secs||0,startAt:Date.now(),endAt:mode==='down'?Date.now()+(secs||0)*1000:null,paused:false,left:null});
  btTick();
}
function btPause(key){ const st=btGet(); if(!st||st.key!==key||st.paused)return;
  st.left = st.mode==='down' ? Math.max(0,(st.endAt-Date.now())/1000) : (Date.now()-st.startAt)/1000;
  st.paused=true; btSet(st); btTick(); }
function btStop(key){ const st=btGet(); if(!st||st.key!==key)return;
  const el = st.paused ? st.left : (Date.now()-st.startAt)/1000;
  const inp=document.getElementById(key+'-1-t');
  if(inp){ inp.value=fmtClock(el); inp.dispatchEvent(new Event('input',{bubbles:true})); }
  btSet(null); btTick(); }
function btReset(key,secs){ const st=btGet(); if(st&&st.key===key) btSet(null);
  const d=document.querySelector('[data-bt="'+key+'"]'); if(d) d.textContent=fmtClock(secs||0); }
function btTick(){
  const st=btGet(); if(!st) return;
  document.querySelectorAll('[data-bt]').forEach(el=>{
    if(el.getAttribute('data-bt')!==st.key) return;
    let t;
    if(st.paused) t=st.left;
    else if(st.mode==='down'){ t=(st.endAt-Date.now())/1000;
      if(t<=0){ el.textContent='0:00'; btSet(null); timerDone(); return; } }
    else t=(Date.now()-st.startAt)/1000;
    el.textContent=fmtClock(t);
  });
}
setInterval(btTick,500);

function deloadTransform(day){
  const cp=JSON.parse(JSON.stringify(day));
  const scaleSets=(t)=>t.replace(/(\d+)x(\d+)/,(m,a,b)=>Math.max(2,Math.ceil(+a*0.6))+'x'+b);
  ['am','pm'].forEach(s=>{ cp[s]=(cp[s]||[]).map(e=>{
    const x=Object.assign({},e);
    if(x.type==='note') return x;
    if(x.block&&x.block.seconds){
      const wm=x.text.match(/Every (\d+) min for (\d+) min \((\d+) (windows|rounds)\)/);
      if(wm){
        const win=+wm[1], n2=Math.max(2,Math.round(+wm[3]*0.7)), tot=win*n2;
        x.block=Object.assign({},x.block,{seconds:tot*60});
        x.text=x.text.replace(wm[0],'Every '+win+' min for '+tot+' min ('+n2+' '+wm[4]+')');
        return x;
      }
      const am=x.text.match(/^(AMRAP|EMOM) (\d+)/);
      const ns=Math.max(300,Math.round(x.block.seconds*0.7/60)*60);
      x.block=Object.assign({},x.block,{seconds:ns});
      if(am) x.text=x.text.replace(am[0],am[1]+' '+Math.round(ns/60));
      else x.text=x.text.replace(/\(cap (\d+) min\)/,(mm,c)=>'(cap '+Math.ceil(+c*0.7)+' min)');
      return x;
    }
    if(x.block){
      x.text=x.text.replace(/\(cap (\d+) min\)/,(mm,c)=>'(cap '+Math.ceil(+c*0.7)+' min)');
      return x;
    }
    if(/\(overload/.test(x.text)){ x.text='[optional on deload] '+x.text; return x; }
    if(/^(Zone 2 run|Long run)/.test(x.text))
      x.text=x.text.replace(/(\d+)(\s*min)/,(m,n,u)=>Math.max(20,Math.round(+n*0.7/5)*5)+u);
    else if(['lift','core','plyo','sprint','hyrox'].indexOf(x.type)>=0)
      x.text=scaleSets(x.text);
    return x;
  });});
  return cp;
}
function render(){
  let day=getDay();
  const __udl = day && udlHas(day.w);
  if(__udl) day=deloadTransform(day);
  curDay=day;
  const today=localDateStr();
  const skipped=skips.includes(curDate);
  const app=document.getElementById('app');

  let header=`<div class="header"><div class="brand">HYROX Elite · BackSafe 365</div>
    <div class="date-big">${curDate===today?'Today':fmtNice(curDate)}</div>
    <label class="date-tap">📅 <input type="date" id="date-input" value="${curDate}" min="${PLAN_MIN}" max="${PLAN_MAX}" onchange="onDatePicked(this.value)"></label>`;
  if(day) header+=`<div class="week-phase">Week ${day.w} · <span class="phase-badge" style="${phaseStyle(day.phase)}">${day.phase}</span>${isDeloadWeek(day.w)?'<span class="deload-badge">Deload</span>':''}${day._edited?'<span class="edited-badge">Edited</span>':''}</div>`;
  if(skips.length) header+=`<div class="skip-chip">⏭ ${skips.length} day${skips.length>1?'s':''} shifted</div>`;
  header+='</div>';

  const nav=`<div class="nav-row"><button class="nav-btn" onclick="goDate(-1)">← Prev</button>
    <button class="nav-btn${curDate===today?' active':''}" onclick="goToday()">Today</button>
    <button class="nav-btn" onclick="goDate(1)">Next →</button></div>`;

  if(!day){
    let body='';
    if(skipped) body+=`<div class="skip-banner"><div class="skip-banner-text">Rest day — workout shifted forward</div><button class="unskip-btn" onclick="unskipDay('${curDate}')">Undo</button></div>`;
    else body+=`<div class="no-workout"><div style="font-size:40px">📅</div><div>No workout scheduled</div><div class="sub">Plan runs ${PLAN_MIN} → ${PLAN_MAX}</div></div>`;
    app.innerHTML=header+nav+`<div class="body">${body}</div>`;
    return;
  }

  curKeyEx={}; sessionEntries(day,'am').forEach(e=>curKeyEx[e.key]=e.ex); sessionEntries(day,'pm').forEach(e=>curKeyEx[e.key]=e.ex);
  const extras={}; for(const k in dayData){ if(dayData[k] && dayData[k].extra) extras[k]=dayData[k].extra; }

  const hasAm=(day.am||[]).length>0, hasPm=(day.pm||[]).length>0;
  let vw=view; if(!hasAm) vw='pm'; if(!hasPm) vw='am';

  const firstKey='am', secondKey='pm';
  const tabBtn=(key,num)=>{ const tag=key==='am'?'AM · Cardio':'PM · Training';
    const name=key==='am'?day.am_name:day.pm_name;
    return `<button class="tab${vw===key?' active':''}" onclick="setView('${key}')"><span class="tab-num">${num}</span><span class="tab-txt"><span class="tab-main">${tag}</span><span class="tab-sub">${esc2(name)}</span></span></button>`; };
  const tabs=(hasAm&&hasPm)?`<div class="tabs">${tabBtn(firstKey,'①')}${tabBtn(secondKey,'②')}</div>`:'';
  const sessionHtml=renderSession(day, vw, extras);

  const actions=`<div class="actions">
    <button class="act-btn" onclick="resetDay()">Reset day</button>
    <button class="act-btn" onclick="openEditSheet()">✏️ Edit workout</button>
    <button class="act-btn skip" onclick="skipDay('${curDate}')">⏭ Skip day — shift plan forward</button>
    <button class="act-btn" onclick="toggleUserDeload()">🪫 Deload this week</button>
    <button class="act-btn" onclick="exportData()">⬇ Export log data</button>
    <label class="act-btn" style="text-align:center;cursor:pointer">⬆ Import data<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label></div>`;

  const udlBanner=__udl?`<div class="udl-banner"><span>🪫 <b>DELOAD — self-called.</b> Volumes trimmed ~30%; overload items optional. Trim a round if you need to.</span><button onclick="toggleUserDeload()">undo</button></div>`:'';
  app.innerHTML=header+nav+`<div class="body">${udlBanner}${tabs}${sessionHtml}${actions}</div>`;
  hydrate();
  document.querySelectorAll('.block-card').forEach(card=>{
    const key=card.dataset.key; const d=dayData[key]; if(!d||!d.s) return;
    Object.keys(d.s).forEach(sub=>{ const s=d.s[sub];
      ['r','w','t'].forEach(f=>{ if(s&&s[f]!=null&&s[f]!==''){ const inp=document.getElementById(key+'-'+sub+'-'+f); if(inp) inp.value=s[f]; } });
    });
  });
  btTick();
}

function hydrate(){
  // delegated input listener (attach once)
  const app=document.getElementById('app');
  app.oninput=onFieldInput; app.onchange=onFieldInput;
  // apply saved state per card
  document.querySelectorAll('.ex-card').forEach(card=>{
    const key=card.dataset.key; const d=dayData[key]; const ex=curKeyEx[key]; if(!ex) return;
    const spec=specFor(ex, (d&&d.extra)||0);
    if(d&&d.checked) card.classList.add('done');
    // set rows
    card.querySelectorAll('.set-row').forEach(row=>{
      const sub=row.id.slice(key.length+1);
      if(d&&d.sc&&d.sc[sub]) row.classList.add('done');
      if(d&&d.s&&d.s[sub]){ const s=d.s[sub];
        ['r','w','t'].forEach(f=>{ const inp=document.getElementById(key+'-'+sub+'-'+f); if(inp&&s[f]!=null) inp.value=s[f]; }); }
    });
    // metrics
    if(d&&d.m){ const di=document.getElementById(key+'-m-dist'); if(di&&d.m.dist!=null) di.value=d.m.dist;
      const ti=document.getElementById(key+'-m-time'); if(ti&&d.m.time!=null) ti.value=d.m.time;
      const ca=document.getElementById(key+'-m-cal'); if(ca&&d.m.cal!=null) ca.value=d.m.cal; }
    // rest label
    const rl=card.querySelector('.rest-label'); if(rl){ const secs=restSeconds(spec,ex.text); rl.textContent='⏱ '+fmtRest(secs)+' rest between sets'; }
    // remove-set button visibility
    if(d&&d.extra>0){ const rm=card.querySelector('.mini-btn.rm'); if(rm) rm.style.display=''; }
    // factual last-logged line for lifts (replaces the old suggestion chip)
    if(spec.mode==='sets' && spec.resolvedType==='lift'){
      const ll = lastLogged(ex.text);
      if(ll){ const head=card.querySelector('.set-head');
        const line=document.createElement('div'); line.className='lastlog';
        line.innerHTML=fmtLastLogged(ll);
        if(head) head.parentNode.insertBefore(line, head);
      }
    }
  });
}

// ── small utils ──
function esc2(s){ return String(s||'').replace(/</g,'&lt;'); }
function fmtNice(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}); }
const PHASE_COLORS={
  'Peak Overload':['rgba(251,191,36,.18)','#fbbf24'], 'Foundation':['rgba(96,165,250,.16)','#60a5fa'],'Strength & Power':['rgba(167,139,250,.18)','#a78bfa'],
  'HYROX Engine':['rgba(248,113,113,.16)','#f87171'],'Race Specific':['rgba(251,146,60,.18)','#fb923c'],
  'Advanced Performance':['rgba(52,211,153,.16)','#34d399'],'Peak & Taper':['rgba(45,212,191,.16)','#2dd4bf'] };
function phaseStyle(p){ const c=PHASE_COLORS[p]||['rgba(144,144,160,.16)','#9090a0']; return `background:${c[0]};color:${c[1]}`; }

// ── boot ──
function boot(){ skips=loadSkips(); curDate=clampDate(localDateStr()); dayData=loadDay(); applyDefaultView(); render(); }
if(typeof document!=='undefined' && document.getElementById('app')) boot();
else if(typeof document!=='undefined') document.addEventListener('DOMContentLoaded',boot);
if(typeof module!=='undefined') module.exports={ boot, render, toggleCard, toggleSet, getDay,
  skipDay, unskipDay, _set:(s)=>{curDate=s.curDate;skips=s.skips||[];dayData=s.dayData||{};view=s.view||'am';},
  _get:()=>({curDate,skips,dayData,view,curPlanDate}) };
</script>
</body></html>
